name: Bug report
description: Something displayed wrong, didn't fill, or broke. Two minutes of detail here usually turns into a same-day fix.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. PaperTrench's whole promise is honest numbers, so
        bugs — especially wrong numbers — are the top priority. The fields below
        are exactly what we need to reproduce it.
  - type: dropdown
    id: site
    attributes:
      label: Site
      description: Where did it happen?
      options: [Axiom, Padre, Photon, GMGN, BullX NEO, Dexscreener, Birdeye, Jupiter, Pump.fun, Dashboard / Popup, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PaperTrench version
      description: chrome://extensions → PaperTrench → version number.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL shape
      description: The URL where it happened. Feel free to replace the token address with XXXX — the route shape is what matters.
      placeholder: "https://axiom.trade/meme/XXXX"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: If a number was wrong (price, P&L, average, marker position), say what it showed and what it should have shown.
    validations:
      required: true
  - type: dropdown
    id: feedstate
    attributes:
      label: What did the live dot show at the time?
      description: The dot next to the price in the panel header.
      options: ["Green (live)", "Amber/warn (stale)", "Didn't notice", "No panel visible"]
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: F12 → Console tab → paste anything red, plus any lines mentioning PaperTrench.
      render: text
  - type: dropdown
    id: volume
    attributes:
      label: Was the market moving fast at the time?
      description: High-volume moments are a known class of bug — this flag routes the report.
      options: ["Yes — fast/volatile", "No — quiet", "Not sure"]
